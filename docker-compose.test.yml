services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nutriflow_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - nutriflow-test-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nutriflow_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ROOT_USER: minioadmin
    ports:
      - "9000:9000"
    volumes:
      - nutriflow-test-minio:/data

  valkey:
    image: valkey/valkey:8.1.10-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nutriflow-test-postgres:
  nutriflow-test-minio:
