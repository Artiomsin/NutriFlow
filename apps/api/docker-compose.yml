
services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: nutriflow
      POSTGRES_PASSWORD: nutriflow_pass
      POSTGRES_DB: nutriflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: quay.io/minio/minio
    container_name: minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    entrypoint: >
      /bin/sh -c "
        minio server /data --console-address ':9001' &
        sleep 2;
        mc alias set local http://127.0.0.1:9000 minioadmin minioadmin;
        mc ls local/nutriflow-uploads >/dev/null 2>&1 || mc mb local/nutriflow-uploads;
        mc anonymous set public local/nutriflow-uploads;
        echo 'Bucket ready';
        wait;
      "

volumes:
  postgres_data:
  minio_data: